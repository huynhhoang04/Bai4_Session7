version: '3.8'

services:
  self-hosted-runner:
    image: ghcr.io/actions/actions-runner:latest
    container_name: quickbite-restaurant-runner
    environment:
      - GITHUB_REPOSITORY=quickbite/restaurant-service
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - RUNNER_LABELS=quickbite,self-hosted,restaurant-service
      - RUNNER_NAME=restaurant-service-runner
      - RUNNER_WORKDIR=/tmp/runner-work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner-work
    restart: unless-stopped

volumes:
  runner-work: